name: Build all apps
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The Bazel build of everything (see docs/bazel.md): the desktop app, the backend and its tests, the
# Android APK and the JVM tests on Linux and macOS, plus the iOS app and its bundle test on macOS
# (.bazelrc leaves app/iosApp out of a Linux build). Bazel fetches the Kotlin Multiplatform rules
# itself: MODULE.bazel pins a commit of the kmp branch of JetBrains/rules_kotlin (archive_override),
# which the repository cache keeps between runs.
jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the app
        uses: actions/checkout@v4
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true
      - name: Set Xcode version
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Build everything
        run: bazel build //...
      - name: Run the tests
        run: bazel test //...
      - name: Build the backend deploy jar
        if: runner.os == 'Linux'
        run: bazel build //backend:backend_deploy.jar
      # The APK and the IPA are built in the configurations of their platforms, whose output
      # directories are not the bazel-bin of the host: cquery prints their paths (the files of
      # android_binary are the APK, the unsigned APK and the deploy jar).
      - name: Collect the artifacts
        run: |
          mkdir -p artifacts
          cp "$(bazel cquery --output=files //app/androidApp | grep '/androidApp\.apk$')" artifacts/
          if [ "$RUNNER_OS" = Linux ]; then
            cp "$(bazel cquery --output=files //backend:backend_deploy.jar)" artifacts/
          else
            cp "$(bazel cquery --output=files //app/iosApp:KotlinConf)" artifacts/
          fi
      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kotlinconf-${{ matrix.os }}
          path: artifacts/
